[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#04111f"
secondaryBackgroundColor = "#071a30"
textColor = "#e6f6ff"
borderColor = "#155e75"
linkColor = "#67e8f9"
font = "Tajawal:https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
baseRadius = "0.8rem"

[client]
toolbarMode = "minimal"

[server]
headless = true
fileWatcherType = "poll"

[browser]
gatherUsageStats = false
